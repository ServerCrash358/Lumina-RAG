# docker-compose.yml — local dev stack for Lumina.
#
# Ports are offset from the other projects on this machine to avoid clashes:
#   Postgres → 5435   Redis → 6380   API → 8001
# Inside the compose network, services reach each other by name (db, redis).
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://lumina:lumina@db:5432/lumina
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      # The embedder + reranker run INSIDE this Linux container on CPU (Windows
      # Docker can't pass the GPU through easily). They're small, so that's fine.
      EMBED_DEVICE: cpu
      # The LLM stays on the HOST via Ollama (uses your GPU). From inside the
      # container, the host is reachable as host.docker.internal — NOT localhost.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: lumina-llm
      # Persist downloaded HF models (embedder ~130MB + reranker ~80MB) in a
      # volume so they're not re-downloaded on every container restart.
      HF_HOME: /home/appuser/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes the host reachable on Linux too
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  db:
    image: pgvector/pgvector:pg17     # Postgres 17 with pgvector preinstalled
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina
      POSTGRES_DB: lumina
    ports: ["5435:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first init — creates the extension, table, and indexes.
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  hf_cache:
