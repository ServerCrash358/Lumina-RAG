# Apply everything as one unit:  kubectl apply -k k8s/
# Ordered so the namespace + config exist before the workloads that use them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lumina
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
