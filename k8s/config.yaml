# Non-secret app config (ConfigMap) + the DB DSN (Secret).
# In a real cluster the Secret would come from a sealed-secret / external store;
# here it's inline for the local demo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumina-config
  namespace: lumina
data:
  APP_ENV: "production"
  REDIS_URL: "redis://redis:6379/0"
  EMBED_DEVICE: "cpu"                 # embedder + reranker run on CPU in-pod
  # The LLM stays on the host GPU; pods reach it via Docker Desktop's host bridge.
  LLM_BASE_URL: "http://host.docker.internal:11434/v1"
  LLM_MODEL: "lumina-llm"
  EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
  EMBEDDING_DIM: "384"
  CACHE_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: lumina-secret
  namespace: lumina
type: Opaque
stringData:
  DATABASE_URL: "postgresql://lumina:lumina@postgres:5432/lumina"
